# Parametros do veiculo (hatch ~900 kg) e dos 3 cenarios de altura do CG.
# Valores marcados [EST] sao ESTIMADOS (tipicos de hatch compacto) e devem ser
# substituidos por dados medidos/do fabricante quando existirem.
veiculo:
  M: 900.0                    # kg, massa total (TCC Tab. 2)
  L: 2.46                     # m, entre-eixos (TCC Tab. 2)
  m_nao_suspensa_eixo: 40.0   # kg por eixo (2 rodas+cubo+freio) [EST]
  fracao_peso_dianteiro: 0.60 # 60% do peso no eixo dianteiro => a = 0,4 L [EST]
  raio_giracao_rel: 0.35      # r_y / L ; Iy = m_suspensa * r_y^2 [EST]
  ke_d: 32000.0               # N/m por eixo (f ~1,3 Hz) [EST]
  ke_t: 25000.0               # N/m por eixo (f ~1,4 Hz) [EST]
  ce_d: 2400.0                # N.s/m por eixo (zeta ~0,3) [EST]
  ce_t: 1700.0                # N.s/m por eixo [EST]
  kp_d: 340000.0              # N/m pneu (2 pneus por eixo) [EST]
  kp_t: 340000.0
  cp_d: 0.0                   # pneu como mola pura (TCC)
  cp_t: 0.0
  k_batente: 200000.0         # N/m, batente de compressao/extensao [EST]
  c_batente: 2000.0           # N.s/m [EST]
  x_banco: 0.30               # m a frente do CG, posicao do motorista [EST]

# Fatores k/c e cursos sao ARBITRARIOS (definidos pelo autor do TCC).
# curso_compressao + curso_extensao = curso util (120 mm, TCC Tab. 2).
cenarios:
  original: {h: 0.82, fator_k: 1.0, fator_c: 1.00, curso_compressao_mm: 70, curso_extensao_mm: 50}
  alto:     {h: 0.88, fator_k: 0.8, fator_c: 0.89, curso_compressao_mm: 90, curso_extensao_mm: 30}
  baixo:    {h: 0.76, fator_k: 1.3, fator_c: 1.14, curso_compressao_mm: 40, curso_extensao_mm: 80}
